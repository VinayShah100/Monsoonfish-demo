<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Shapes Balance</title>
  <!-- <link rel="stylesheet" href="sape.css"> -->
</head>
<style>
    /* Global Page Styling */
body {

  background-color: #1c1a1a; /* Dark background */
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  position: relative;
}

/* Close Button */
.close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  color: #fff;
  font-size: 26px;
  cursor: pointer;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.3s ease;
}
.close-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

/* Container */
.container {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  width: 100%;
  max-width: 400px;
  min-height: 90vh;
  padding: 1rem;
  margin-top: 40px; /* prevent overlap with close button */
}

/* Title */
h1 {
  font-size: 1.4rem;
  font-weight: bold;
  margin-bottom: 2rem;
  text-transform: lowercase;
  color: #f5f5f5;
}

/* Options Section */
.options {
  display: flex;
  gap: 1rem;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: auto;
}

.option {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.option img {
  width: 140px;
  height: 140px;
  border: 1px solid #ccbfbf;
  object-fit: contain;
  background: #1c1a1a;
  padding: 1rem;
  display: block;
  border-radius: 4px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.option p {
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  margin-top: 0.5rem;
  text-align: center;
  text-transform: lowercase;
}

.option:hover img {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
}

/* Selected Option */
.option.selected img {
  box-shadow: 0 0 12px rgba(255, 215, 92, 0.8);
  border: 2px solid rgba(255, 215, 92, 0.9);
}

/* Continue Button */
.continue-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 10px 22px;
  gap: 8px;
  background: #ffffff;
  color: #000000;
  font-size: 1rem;
  font-weight: 500;
  text-transform: lowercase;
  border: none;
  cursor: pointer;

  /* Only top-right corner is cut */
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);

  /* Inner glow effect */
  box-shadow:
    inset 8px 0px 12px rgba(255, 215, 92, 0.4),
    0 4px 10px rgba(0, 0, 0, 0.4);
  
  transition: transform 0.25s ease, box-shadow 0.3s ease;
}

.continue-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 8px 0px 16px rgba(255, 215, 92, 0.6),
    0 6px 12px rgba(0, 0, 0, 0.5);
}

.continue-btn:active {
  transform: scale(0.98);
}

.arrow {
  font-size: 1.2rem;
  transition: transform 0.3s ease;
}

.continue-btn:hover .arrow {
  transform: translateX(3px);
}

</style>
<body>

  <!-- Close Button -->
  <button class="close-btn" onclick="window.location.href='../Pages/welcome.html'">&times;</button>

  <!-- Main Container -->
  <div class="container">
    
    <!-- Title -->
    <h1 class="title">what shapes<br>balance.</h1>

    <!-- Options Section -->
    <div class="options">
      <div class="option">
        <img src="../Img/black-hire01.png" alt="Maslow's hierarchy">
        <p>maslow’s hierarchy<br>of needs</p>
      </div>
      <div class="option">
        <img src="../Img/lader.png" alt="The Cantril Ladder">
        <p>the cantril ladder</p>
      </div>
    </div>

    <!-- Continue Button -->
    <button class="continue-btn" id="continueButton">
      continue
      <span class="arrow">➜</span>
    </button>

  </div>

  <script>
    // Add event listener to the continue button
    document.getElementById('continueButton').addEventListener('click', function() {
      // Navigate to the next page
      window.location.href = '../Pages/maslow-hierarchy.html'; // Change this to your desired URL
    });
    
    // Optional: Add functionality to the close button
    document.querySelector('.close-btn').addEventListener('click', function() {
      // Close the window or navigate back
      window.close(); // or history.back() to go back
    });
  </script>
</body>
</html>
