<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #111;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding-top: 20px;
    }

    .card {
      background: #000;
      color: #F7F5EB;
      width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: opacity 0.2s;
    }

    .icon-btn:hover { opacity: 0.7; }

    .card-header-right { display: flex; gap: 14px; }

    .greeting { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 16px; opacity: 0.8; margin-bottom: 20px; }

    .bars { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .bar-container { display: flex; flex-direction: column; align-items: center; }
    .bar { width: 20px; height: 120px; background: #222; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .bar-fill { background: #F7F5EB; width: 100%; transition: height 0.5s ease; }
    .bar-label { font-size: 12px; margin-top: 4px; color: #F7F5EB; }

    .overall { font-size: 16px; margin-bottom: 14px; line-height: 1.4; }
    .overall span { font-size: 28px; font-weight: bold; color: #AEE6FF; }

    .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .status-card { background: #F7F5EB; color: #000; text-align: center; padding: 16px 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.2s ease; }
    .status-card:hover { transform: translateY(-2px); }
    .status-icon { margin-bottom: 6px; }
    .status-value { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
    .status-label { font-size: 14px; font-weight: 500; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card" id="dashboardCard">
    <!-- Header -->
    <div class="card-header">
      <div class="icon-btn">
        <svg width="22" height="22" fill="none" stroke="#F7F5EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="7" r="4"></circle>
          <path d="M4 20c0-4 3-7 7-7s7 3 7 7"></path>
        </svg>
      </div>
      <div class="card-header-right">
        <!-- Download Button -->
        <div class="icon-btn" id="downloadBtn">
          <svg width="22" height="22" fill="none" stroke="#F7F5EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"></path>
            <path d="M8 11l4 4 4-4"></path>
            <path d="M4 19h16"></path>
          </svg>
        </div>
        <!-- Share Button -->
        <div class="icon-btn" id="shareBtn">
          <svg width="22" height="22" fill="none" stroke="#F7F5EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="M8.59 13.51l6.83 3.98"></path>
            <path d="M15.41 6.51l-6.82 3.98"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Greeting Section -->
    <div class="greeting">Hello <span id="userName">Guest</span>,</div>
    <div class="subtitle">Here are your results</div>

    <!-- Bars Section -->
    <div class="bars">
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
      <div class="bar-container"><div class="bar"><div class="bar-fill" style="height: 0%;"></div></div><div class="bar-label">0</div></div>
    </div>

    <!-- Overall Score -->
    <div class="overall">Over <br> all life balance <span>0%</span></div>

    <!-- Status Grid -->
    <div class="status-grid">
      <div class="status-card"><div class="status-icon">❤️</div><div class="status-value">0</div><div class="status-label">Health</div></div>
      <div class="status-card"><div class="status-icon">😊</div><div class="status-value">0</div><div class="status-label">Happiness</div></div>
      <div class="status-card"><div class="status-icon">😔</div><div class="status-value">0</div><div class="status-label">Sad</div></div>
      <div class="status-card"><div class="status-icon">🔥</div><div class="status-value">0</div><div class="status-label">Energy</div></div>
    </div>
  </div>

  <!-- Include html2canvas for screenshot functionality -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // Load user name
    const storedName = localStorage.getItem("user_name");
    if (storedName) document.getElementById("userName").textContent = storedName;

    // Load answers from previous pages (q1-q10)
    const barContainers = document.querySelectorAll(".bar-container");
    const statusValues = document.querySelectorAll(".status-value");
    const barLabels = document.querySelectorAll(".bar-label");
    const answers = [];
    for(let i=1;i<=10;i++){
      const val = parseInt(localStorage.getItem("q"+i)) || Math.floor(Math.random()*100)+1;
      answers.push(val);
    }

    // Map answers to bars
    barContainers.forEach((barContainer, index)=>{
      const val = answers[index];
      const fill = barContainer.querySelector(".bar-fill");
      const label = barContainer.querySelector(".bar-label");
      fill.style.height = val + "%";
      label.textContent = val;
    });

    // Overall average
    const overallVal = Math.round(answers.reduce((a,b)=>a+b,0)/answers.length);
    document.querySelector(".overall span").textContent = overallVal + "%";

    // Status cards
    const statusValuesArr = ["Health","Happiness","Sad","Energy"];
    statusValues.forEach((statusEl,index)=>{
      const val = answers[answers.length-4+index];
      statusEl.textContent = val;
    });

    // Download button
    document.getElementById("downloadBtn").addEventListener("click", ()=>{
      html2canvas(document.getElementById("dashboardCard")).then(canvas=>{
        const link = document.createElement("a");
        link.download = "dashboard.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });

    // Share button
    document.getElementById("shareBtn").addEventListener("click", async ()=>{
      if(navigator.share){
        html2canvas(document.getElementById("dashboardCard")).then(canvas=>{
          canvas.toBlob(blob=>{
            const file = new File([blob], "dashboard.png",{type:"image/png"});
            navigator.share({files:[file], title:"My Dashboard", text:"Check out my results!"})
            .catch(err=>console.log("Share canceled", err));
          });
        });
      } else {
        alert("Sharing not supported on this browser. You can download the dashboard instead.");
      }
    });
  </script>
</body>
</html>
