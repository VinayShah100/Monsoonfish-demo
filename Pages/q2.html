<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Age</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #3a3a3a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Section */
    .top-section {
      background: #f4f0de;
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .progress-container {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 1.2rem;
    }

    .progress {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: transparent;
      border: 1px solid #000;
      border-radius: 50%;
    }

    .dot.active {
      background: #000;
    }

    .back-button {
      align-self: flex-start;
      background: none;
      border: none;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 5px;
    }

    .back-button svg {
      width: 100%;
      height: 100%;
    }

    .top-section h1 {
      font-size: 1.8rem;
      line-height: 1.3;
      font-weight: 400;
      color: #111;
      margin-top: auto;
      margin-bottom: auto;
      text-align: center;
    }

    /* Bottom Section */
    .bottom-section {
      background: #181818;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
      
    }

    .bottom-section p {
      color: #ccc;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    /* Number Picker */
    .number-picker-container {
      width: 100%;
      position: relative;
      height: 200px;
      overflow: hidden;
    }

    .number-picker {
      display: flex;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      height: 100%;
      align-items: center;
    }

    .number-picker::-webkit-scrollbar {
      display: none;
    }

    .number {
      flex: 0 0 33.33%;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 300;
      color: #444;
      scroll-snap-align: center;
      transition: all 0.3s ease;
      opacity: 0.6;
    }

    .number.active {
      font-size: 5rem;
      font-weight: 700;
      color: #fff;
      opacity: 1;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .number.adjacent {
      font-size: 3rem;
      font-weight: 400;
      color: #888;
      opacity: 0.8;
    }

    /* Next Button */
    #nextBtn {
      position: absolute;
      right: 20px;
      bottom: 60px;
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #nextBtn:hover {
      background: #444;
    }

    #nextBtn span {
      font-size: 1.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Top Section -->
    <div class="top-section">
      <div class="progress-container">
        <div class="progress">
          <span class="dot active"></span>
          <span class="dot "></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <button class="back-button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>How old are you<br>feeling today?</h1>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <p>Swipe to select</p>
      <div class="number-picker-container">
        <div class="number-picker" id="picker"></div>
      </div>

      <!-- Next Button -->
      <button id="nextBtn"><span>&rarr;</span></button>
    </div>
  </div>

  <script>
    const picker = document.getElementById('picker');
    const backButton = document.querySelector('.back-button');
    const nextBtn = document.getElementById('nextBtn');

    // Generate numbers (1–100)
    for (let i = 1; i <= 100; i++) {
      const num = document.createElement('div');
      num.classList.add('number');
      num.textContent = i;
      num.dataset.value = i;
      picker.appendChild(num);
    }

    function updateNumberStyles() {
      const numbers = document.querySelectorAll('.number');
      const center = picker.scrollLeft + picker.clientWidth / 2;

      numbers.forEach(num => {
        const rectCenter = num.offsetLeft + num.offsetWidth / 2;
        const dist = Math.abs(center - rectCenter);
        const maxDist = picker.clientWidth / 3;
        num.classList.remove('active', 'adjacent');

        if (dist < 10) {
          num.classList.add('active');
        } else if (dist < maxDist * 0.5) {
          num.classList.add('adjacent');
        }
      });
    }

    function getSelectedNumber() {
      const activeNum = document.querySelector('.number.active');
      return activeNum ? activeNum.dataset.value : null;
    }

    function snapToCenter() {
      const numbers = document.querySelectorAll('.number');
      const center = picker.scrollLeft + picker.clientWidth / 2;
      let closest = null;
      let closestDist = Infinity;

      numbers.forEach(num => {
        const rectCenter = num.offsetLeft + num.offsetWidth / 2;
        const dist = Math.abs(center - rectCenter);
        if (dist < closestDist) {
          closestDist = dist;
          closest = num;
        }
      });

      if (closest) {
        picker.scrollTo({
          left: closest.offsetLeft - picker.clientWidth / 2 + closest.offsetWidth / 2,
          behavior: "smooth"
        });
        updateNumberStyles();
      }
    }

    // Back button
    backButton.addEventListener('click', () => {
      window.location.href = "../Pages/q1.html"; // Go back to name input page
    });

    // Next button
    nextBtn.addEventListener('click', () => {
      const selectedAge = getSelectedNumber();
      if (selectedAge) {
        localStorage.setItem("user_age", selectedAge);
        window.location.href = "../Pages/q3.html"; // Go to next question page
      } else {
        alert("Please select your age before proceeding.");
      }
    });

    // Setup on load
    window.onload = () => {
      const numbers = document.querySelectorAll('.number');
      const defaultNum = numbers[33]; // Start at 34
      picker.scrollTo({
        left: defaultNum.offsetLeft - picker.clientWidth / 2 + defaultNum.offsetWidth / 2,
        behavior: "instant"
      });
      updateNumberStyles();
    };

    picker.addEventListener('scroll', () => {
      requestAnimationFrame(updateNumberStyles);
    });

    let scrollTimeout;
    picker.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(snapToCenter, 150);
    });

    window.addEventListener('resize', () => updateNumberStyles());
  </script>
</body>
</html>
