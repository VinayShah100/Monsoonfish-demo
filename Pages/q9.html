<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When do you feel like yourself?</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #3a3a3a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Section */
    .top-section {
      background: #f4f0de;
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .progress-container {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 1.2rem;
    }

    .progress {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: transparent;
      border: 1px solid #000;
      border-radius: 50%;
    }

    .dot.active {
      background: #000;
    }

    .back-button {
      align-self: flex-start;
      background: none;
      border: none;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 5px;
    }

    .back-button svg {
      width: 100%;
      height: 100%;
    }

    .top-section h1 {
      font-size: 1.8rem;
      line-height: 1.3;
      font-weight: 400;
      color: #111;
      margin-top: auto;
      margin-bottom: auto;
      
    }

    /* Bottom Section */
    .bottom-section {
      background: #181818;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    .bottom-section p {
      color: #ccc;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    /* Options */
    .options-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .option {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 0.9rem;
      color: #fff;
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .option:hover {
      background: #333;
    }

    .option.selected {
      background: #f4f0de;
      color: #111;
      border-color: #d4d0c0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Top Section -->
    <div class="top-section">
      <div class="progress-container">
        <div class="progress">
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <button class="back-button" id="backButton">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>what does a "good <br> day" usually look like <br> for you?</h1>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="options-container">
        <div class="option" data-value="structure">Structure</div>
        <div class="option" data-value="spontaneity">Spontaneity</div>
        <div class="option" data-value="reflection">Reflection</div>
        <div class="option" data-value="action">Action</div>
        <div class="option" data-value="rest">Rest</div>
      </div>
    </div>
  </div>

  <script>
  // Option selection with auto-navigation
  const options = document.querySelectorAll('.option');

  options.forEach(option => {
    option.addEventListener('click', () => {
      // Remove selected class from all options
      options.forEach(opt => opt.classList.remove('selected'));
      
      // Add selected class to clicked option
      option.classList.add('selected');
      const selectedValue = option.dataset.value;

      // ✅ Save selected value to localStorage
      localStorage.setItem("user_q9", selectedValue);
      
      // Wait a moment to show the selection, then navigate
      setTimeout(() => {
        // Replace this path with your actual next page path
        const nextPagePath = '../Pages/q10.html'; 
        
        // Navigate to the next page
        window.location.href = nextPagePath;
      }, 400); // 400ms delay to show the selection
    });
  });

  // Back button functionality - goes to previous page
  document.getElementById('backButton').addEventListener('click', function() {
    // Replace this with the path to your previous page
    const previousPagePath = '../Pages/q8.html';
    
    // Navigate to the previous page
    window.location.href = previousPagePath;
  });
</script>

</body>
</html>
