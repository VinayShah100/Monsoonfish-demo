<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Input</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #121212;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* Card container */
    .card {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top section */
    .top-section {
      background: #f4f0de;
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 2rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: transparent;
      border: 1px solid #000;
      border-radius: 50%;
    }

    .dot.active {
      background: #000;
    }
    
    .back-button {
      align-self: flex-start;
      background: none;
      border: none;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 5px;
    }

    .back-button svg {
      width: 100%;
      height: 100%;
    }


    .top-section h1 {
      font-size: 1.8rem;
      line-height: 1.3;
      font-weight: 400;
      color: #111;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* Bottom section */
    .bottom-section {
      background: #181818;
      flex: 1;
      padding: 1.5rem;
      display: flex;
      align-items: flex-start;
      position: relative;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #aaa;
      background: transparent;
      padding: 0.6rem 0;
      font-size: 1rem;
      font-weight: 300;
      color: #fff;
    }

    input::placeholder {
      color: #bbb;
      font-weight: 300;
    }

    /* Button */
    #nextBtn {
      position: absolute;
      right: 0;
      bottom: -210px;
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #nextBtn:hover {
      background: #444;
    }

    #nextBtn span {
      font-size: 1.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Top Section -->
    <div class="top-section">
      <!-- Progress dots -->
      <div class="progress">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <button class="back-button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Question text -->
      <h1>What should<br>we call you?</h1>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="input-group">
        <input type="text" id="name" placeholder="Enter Name">
        <button id="nextBtn">
          <span>&rarr;</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const nextBtn = document.getElementById('nextBtn');
    const nameInput = document.getElementById('name');
    const backButton = document.querySelector('.back-button');

    // ✅ Save name & redirect on button click
    nextBtn.addEventListener('click', () => {
      const userName = nameInput.value.trim();

      if (userName) {
        // Save name in localStorage
        localStorage.setItem("user_name", userName);

        // Redirect to next page (keep your path correct)
        window.location.href = '../Pages/q2.html';
      } else {
        alert('Please enter your name first');
      }
    });
     // Back button
    backButton.addEventListener('click', () => {
      window.location.href = "../Pages/cantril-lader.html"; // Go back to name input page
    });

    // ✅ Allow pressing Enter to submit
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        nextBtn.click();
      }
    });
  </script>
</body>
</html>
